<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ways · slice 1.5</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0e;
        --ink: #ecece8;
        --muted: #8a8a86;
        --line: #2a2a28;
        --fail: #d4654f;
        --ok: #7ea36b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
      h1 { font-weight: 560; letter-spacing: -0.02em; margin: 0 0 8px; }
      h2 { font-size: 14px; font-weight: 600; margin: 36px 0 10px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
      .sub { color: var(--muted); margin-bottom: 28px; }
      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      textarea, input[type="url"], input[type="text"] {
        width: 100%;
        background: #161616;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      textarea { min-height: 100px; }
      button {
        margin-top: 12px;
        background: var(--ink);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 28px; }
      ol { padding-left: 18px; }
      .phase { font-variant-numeric: tabular-nums; color: var(--muted); }
      .done { color: var(--ok); }
      .failed { color: var(--fail); }
      pre {
        background: #161616;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        font-size: 12px;
      }
      .meta {
        display: grid;
        gap: 4px;
        margin: 12px 0;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
      #recent {
        list-style: none;
        padding: 0;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      #recent li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        cursor: pointer;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #recent li:first-child { border-top: 0; }
      #recent li:hover { background: #161616; }
      #recent .id { color: var(--ink); }
      #recent .when { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>ways</h1>
      <p class="sub">Slice 1.7: optional gitRef (branch / tag / sha) on clone.</p>
      <label for="spec">spec</label>
      <textarea id="spec">clone ways and run its tests</textarea>
      <label for="gitUrl">gitUrl (https, optional)</label>
      <input id="gitUrl" type="url" placeholder="https://github.com/mtclinton/ways-fixture.git" value="" />
      <label for="gitRef">gitRef (branch / tag / sha, optional)</label>
      <input id="gitRef" type="text" placeholder="main" value="" />
      <div><button id="go" type="button">Start run</button></div>

      <h2>Recent runs</h2>
      <ul id="recent"></ul>

      <section id="status" hidden>
        <p id="phase" class="phase"></p>
        <div id="meta" class="meta"></div>
        <p id="previewLink" hidden><a href="#" target="_blank" rel="noopener">Preview</a></p>
        <ol id="events"></ol>
        <pre id="out"></pre>
      </section>
    </main>
    <script type="module">
      const specEl = document.getElementById("spec");
      const gitUrlEl = document.getElementById("gitUrl");
      const gitRefEl = document.getElementById("gitRef");
      const go = document.getElementById("go");
      const recentEl = document.getElementById("recent");
      const status = document.getElementById("status");
      const phaseEl = document.getElementById("phase");
      const metaEl = document.getElementById("meta");
      const previewLink = document.getElementById("previewLink");
      const eventsEl = document.getElementById("events");
      const outEl = document.getElementById("out");

      refreshRecent();

      go.addEventListener("click", async () => {
        go.disabled = true;
        status.hidden = false;
        phaseEl.textContent = "starting…";
        metaEl.textContent = "";
        eventsEl.replaceChildren();
        outEl.textContent = "";
        try {
          const body = { spec: specEl.value };
          const gitUrl = gitUrlEl.value.trim();
          if (gitUrl) body.gitUrl = gitUrl;
          const gitRef = gitRefEl.value.trim();
          if (gitRef) body.gitRef = gitRef;
          const res = await fetch("/api/runs", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          const payload = await res.json();
          if (!res.ok) {
            phaseEl.textContent = `error ${res.status}`;
            outEl.textContent = JSON.stringify(payload, null, 2);
            return;
          }
          await refreshRecent();
          await poll(payload.id);
          await refreshRecent();
        } catch (err) {
          phaseEl.textContent = "failed";
          outEl.textContent = String(err);
        } finally {
          go.disabled = false;
        }
      });

      async function refreshRecent() {
        try {
          const res = await fetch("/api/runs");
          const body = await res.json();
          recentEl.replaceChildren();
          for (const run of body.runs ?? []) {
            const li = document.createElement("li");
            const left = document.createElement("div");
            left.className = "id";
            left.textContent = `${run.id.slice(0, 8)} · ${run.phase}${run.spec ? " · " + run.spec : ""}`;
            const right = document.createElement("div");
            right.className = "when";
            right.textContent = run.createdAt?.replace("T", " ").replace("Z", "") ?? "";
            li.append(left, right);
            li.addEventListener("click", () => loadRun(run.id));
            recentEl.append(li);
          }
          if (!(body.runs ?? []).length) {
            const li = document.createElement("li");
            li.textContent = "No runs yet";
            li.style.cursor = "default";
            recentEl.append(li);
          }
        } catch (err) {
          recentEl.replaceChildren();
          const li = document.createElement("li");
          li.textContent = String(err);
          recentEl.append(li);
        }
      }

      async function loadRun(id) {
        status.hidden = false;
        go.disabled = true;
        try {
          await poll(id);
        } finally {
          go.disabled = false;
        }
      }

      async function poll(id) {
        for (let i = 0; i < 120; i++) {
          const res = await fetch(`/api/runs/${id}`);
          const run = await res.json();
          render(run);
          if (run.phase === "done" || run.phase === "failed") return;
          await new Promise((r) => setTimeout(r, 1000));
        }
        phaseEl.textContent = "timed out waiting for terminal phase";
      }

      function render(run) {
        phaseEl.textContent = `${run.id} · slice ${run.slice} · ${run.phase}`;
        phaseEl.className = "phase " + run.phase;
        const resultJson = run.result?.json ?? (() => {
          try {
            return run.result?.stdout ? JSON.parse(run.result.stdout) : null;
          } catch {
            return null;
          }
        })();
        const clone = resultJson?.clone ?? null;
        const head = resultJson?.head ?? null;
        const execute = resultJson?.execute ?? null;
        metaEl.textContent = [
          run.gitUrl ? `gitUrl: ${run.gitUrl}` : null,
          clone != null ? `clone: ${clone}` : null,
          head != null ? `head: ${head}` : null,
          execute
            ? `execute: ${execute.status}${execute.reason ? " (" + execute.reason + ")" : ""} (exit ${execute.exitCode})`
            : null,
          resultJson?.preview
            ? `preview: ${resultJson.preview.status}${resultJson.preview.path ? " · " + resultJson.preview.path : ""}${resultJson.preview.reason ? " (" + resultJson.preview.reason + ")" : ""}`
            : null,
          resultJson?.workerPreview
            ? `workerPreview: ${resultJson.workerPreview.status}${resultJson.workerPreview.url ? " · " + resultJson.workerPreview.url : ""}${resultJson.workerPreview.reason ? " (" + resultJson.workerPreview.reason + ")" : ""}${resultJson.workerPreview.error ? " · " + resultJson.workerPreview.error : ""}`
            : null,
        ]
          .filter(Boolean)
          .join("\n");
        const a = previewLink.querySelector("a");
        if (resultJson?.preview?.status === "ready") {
          a.href = `/api/runs/${run.id}/preview`;
          previewLink.hidden = false;
        } else {
          previewLink.hidden = true;
        }
        eventsEl.replaceChildren();
        for (const ev of run.events ?? []) {
          const li = document.createElement("li");
          li.textContent = `${ev.phase} — ${ev.message}`;
          eventsEl.append(li);
        }
        outEl.textContent = JSON.stringify(
          {
            artifact: run.artifact ?? null,
            result: run.result ?? null,
            resultJson,
            error: run.error ?? null,
          },
          null,
          2,
        );
      }
    </script>
  </body>
</html>
